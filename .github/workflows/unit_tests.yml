name: Unit Tests  # Name of the workflow

on: [push, pull_request]   # 👈 When this workflow is triggered

jobs:
  build:                    # A job is a group of steps
    runs-on: ubuntu-latest  # The virtual machine (OS) GitHub will use

    steps:
      - name: "✨ Checkout repository ✨"
        uses: actions/checkout@v4
        # ✅ Step 1: Check out your code from GitHub so it can be used in the workflow

      - name: "🐍 Set up Python 🐍"
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        # ✅ Step 2: Install Python version 3.11 on the runner (VM)

      - name: "📦 Install dependencies from requirements.txt 📦"
        run: |
          echo "======================================"
          echo "🚀 Installing dependencies... 🚀"
          echo "======================================"
          pip install -r requirements.txt
        # ✅ Step 3: Install all Python packages listed in requirements.txt

      - name: "🧪 Run unit tests 🧪"
        run: |
          echo "======================================"
          echo "🧪 Running unit tests... 🧪"
          echo "======================================"
          pytest
        # ✅ Step 4: Run your test suite

      - name: "🧹 Post-test cleanup 🧹"
        run: |
          echo "======================================"
          echo "🧹 Cleaning up after tests... 🧹"
          echo "======================================"
          rm -rf __pycache__
          rm -rf .pytest_cache
        # ✅ Step 5: Cleanup after tests
